version: "2"

linters:
  default: none
  enable:
    - copyloopvar
    - errorlint
    - exhaustive
    - gosec
    - misspell
    - revive
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/cloudraft/cloudinary-cli
